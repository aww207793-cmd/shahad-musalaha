<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>المسيطر في الكيمياء — هدية لآرام 🌸</title><link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f3f8f5;--tx:#10231d;--mut:#4d6a60;--ac:#0f9d73;--ac2:#0891b2;--gold:#b7791f;--bd:rgba(16,35,29,.16);--card:#fff;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06130f;--tx:#eafff6;--mut:#9cc7b8;--ac:#10d9a0;--ac2:#22d3ee;--gold:#fbbf24;--bd:rgba(255,255,255,.15);--card:#0d211a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.8 "Almarai","Segoe UI",Tahoma,Arial,sans-serif;padding:12px 14px 30px;overflow-x:hidden}
#app{max-width:760px;margin:0 auto}button{font:inherit;color:inherit;cursor:pointer}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}
.frm{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#03120d;border:2px solid var(--gold);border-radius:18px;padding:6px 14px;font-weight:800;color:#fff;font-size:14px}.frm b{color:#fbbf24;letter-spacing:3px;font-family:ui-monospace,monospace}
.hero{text-align:center;margin:12px 0;padding:20px 14px;border-radius:26px;border:1px solid var(--bd);background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 22%,var(--card)),var(--card))}
.flask{width:132px;height:165px;display:block;margin:0 auto;overflow:visible;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(232,121,249,.5))}
@keyframes fl{50%{transform:translateY(-7px) rotate(-3deg)}}
.wv{animation:wv 3s linear infinite}.wv2{animation:wv 5s linear infinite reverse}
@keyframes wv{to{transform:translateX(-60px)}}
.bb{fill:#fff;opacity:0;animation:bb 2.4s ease-in infinite}
@keyframes bb{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-24px);opacity:0}}
.vp{fill:none;stroke:#a5f3fc;stroke-width:1.6;opacity:0;transform-box:fill-box;transform-origin:center;animation:vp 3s ease-out infinite}
@keyframes vp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translateY(-18px) scale(1.5);opacity:0}}
.gl{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{stroke-opacity:.25}}
@media(prefers-reduced-motion:reduce){.flask{animation:none}.vp,.gl{animation:none!important}}
.kick{display:inline-block;border:1px solid var(--ac);color:var(--ac);border-radius:99px;padding:0 14px;font-size:14px;font-weight:800}
h1{margin:6px 0 0;font-size:38px;line-height:1.3;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.dream{margin:10px auto 0;max-width:420px;border:1px dashed var(--gold);border-radius:16px;padding:4px 12px;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:12px 0}
.cd{display:flex;align-items:center;gap:14px;justify-content:center}.cd svg{width:130px;height:130px}.cd small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:16px;text-align:center;padding:8px 4px}.stats b{display:block;font-size:24px;color:var(--ac)}.stats span{font-size:13px;color:var(--mut)}
.rem{display:flex;gap:10px;align-items:center;border:1px solid var(--no);border-radius:16px;padding:10px 14px;margin:12px 0;font-weight:700;background:color-mix(in srgb,var(--no) 12%,var(--card))}.rem button{margin-inline-start:auto;background:var(--no);color:#fff;border:0;border-radius:12px;padding:6px 14px;font-weight:800}
h3{margin:18px 0 8px;font-size:19px;border-inline-start:4px solid var(--gold);padding-inline-start:10px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:13px;font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;margin-top:10px}.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.row{display:flex;gap:10px}
.tp{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:700}.tp i{font-style:normal;margin-inline-start:auto;color:var(--mut);font-size:13px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0}.bk{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 14px;font-weight:700}
.top{display:flex;align-items:center;gap:10px;margin:10px 0}.pr{flex:1;height:10px;background:var(--bd);border-radius:9px}.pr div{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .3s}.cnt{font-size:13px;color:var(--mut)}
.q{border-top:6px solid var(--ac2)}.chip{display:inline-block;background:color-mix(in srgb,var(--ac) 18%,var(--card));border:1px solid var(--ac);border-radius:99px;padding:0 12px;font-size:13px;font-weight:700}.yr{font-size:12px;color:var(--gold);font-weight:800}
.qt{font-size:19px;font-weight:800;margin:10px 0}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px;font:inherit}
.opt{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:700}.opt.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.fbk{border-radius:16px;padding:10px 14px;margin:12px 0;font-weight:800;border:1px solid}.fbk.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.fbk.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card))}.fbk.mid{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.sol{background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--gold);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:16px}.sol .h{color:var(--gold)}
.tip{background:color-mix(in srgb,var(--ac2) 12%,var(--card));border-radius:14px;padding:8px 12px;margin:8px 0;font-size:15px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:380px;text-align:center}.dlg input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--gold);border-radius:14px;padding:12px;font:inherit;text-align:center}
ul.n{margin:6px 0;padding-inline-start:20px}footer{text-align:center;color:var(--mut);font-size:13px;margin-top:22px}
@supports not (color:color-mix(in srgb,red,blue)){.hero{background:var(--card)}.chip{background:rgba(15,157,115,.18)}.fbk.ok{background:rgba(22,163,74,.15)}.fbk.bad{background:rgba(220,38,38,.15)}.fbk.mid{background:rgba(183,121,31,.15)}.tip{background:rgba(8,145,178,.12)}.rem{background:rgba(220,38,38,.12)}}
:root,:root:not([data-theme="light"]){--bg:#16091b;--tx:#f1f5ff;--mut:#cdb6da;--ac:#ec4899;--ac2:#f9a8d4;--gold:#fbbf24;--bd:rgba(255,255,255,.14);--card:#2a1233;color-scheme:dark}body{background:radial-gradient(900px 500px at 85% -10%,rgba(236,72,153,.30),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(162,28,175,.28),transparent 60%),var(--bg);background-attachment:fixed}.frm b{letter-spacing:0;font-family:inherit}.hero{background:linear-gradient(160deg,rgba(236,72,153,.18),rgba(255,255,255,.03)),#1d0c26}.flask{width:96px;height:120px}.thk{display:flex;justify-content:center;margin-top:8px}.thinker{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(251,191,36,.14),0 0 44px rgba(251,191,36,.35);animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}.cap{text-align:center;font-weight:800;color:var(--gold);letter-spacing:2px;font-size:15px;margin-top:4px}.cdn{display:flex;gap:8px;justify-content:center;width:100%}.cdn div{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:16px;padding:8px 4px;text-align:center}.cdn b{display:block;font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums;direction:ltr;line-height:1.3}.cdn span{font-size:13px;color:var(--mut)}.cd:has(.cdn){flex-direction:column;gap:8px}

const D=[
[0,1,"عرّف المواد غير الإلكتروليتية.","المواد غير الإلكتروليتية: هي المواد التي محاليلها المائية غير موصلة للتيار الكهربائي.",[["غير موصل","لاتوصل","لا توصل"],["التيار","الكهرباء","الكهربائي"]],"تذوب بس ما توصل كهرباء لأنها ما تتفكك لأيونات (السكر والكحول)."],
[0,1,"ما الصفات المميزة للإلكتروليتات؟","1) قابليتها على إيصال التيار الكهربائي في حالتها المنصهرة أو عندما تكون على شكل محلول في مذيب مستقطب.<br>2) محصلة الشحنة الكهربائية لمحاليلها مساوية للصفر، أي أنها متعادلة كهربائياً.<br>3) عند ذوبانها في مذيب مستقطب كالماء يتضمن محلولها أيونات موجبة وأيونات سالبة.<br>4) تعتمد قابلية التوصيل على طبيعة الأيونات المكونة له وعلى تراكيزها إضافة إلى درجة حرارة المحلول.",[["ايصال","توصيل","توصل"],["متعادل","مساويه للصفر","محصله"],["موجبه","سالبه","ايونات"],["تركيز","طبيعه","حراره"]],"أربع صفات: توصّل، متعادلة الشحنة، فيها أيونات + و−، والتوصيل يعتمد على النوع والتركيز والحرارة."],
[0,5,"ما الإلكتروليتات؟ وعلام تعتمد قابلية المحلول الإلكتروليتي للتوصيل الكهربائي؟ عددها فقط.","الإلكتروليتات: هي المواد التي تكون لمحاليلها القابلية على توصيل التيار الكهربائي، وقد تكون قوية مثل NaCl أو ضعيفة مثل CH₃COOH.<br><b>تعتمد على:</b> 1) طبيعة الأيونات المكونة له. 2) تركيز الأيونات في المحلول. 3) درجة حرارة المحلول.",[["توصيل","توصل","ايصال"],["طبيعه"],["تركيز"],["حراره"]],"نوع، تركيز، حرارة — ثلاث كلمات وتخلص."],
[0,1,"ما الفرق بين المواد الإلكتروليتية والمواد غير الإلكتروليتية؟","<b>الإلكتروليتية:</b> 1) محاليلها المائية أو منصهراتها (كالأملاح) قابلة للتوصيل الكهربائي. 2) تتفكك لتعطي أيونات موجبة وسالبة مثل الحوامض والقواعد والأملاح. 3) تصنف إلى إلكتروليتات قوية وضعيفة.<br><b>غير الإلكتروليتية:</b> 1) محاليلها المائية غير موصلة رغم ذوبانها في الماء. 2) لا تتفكك أي لا تعطي أيونات، مثل الكحول والسترات والسكروز. 3) لا تصنف إلى قوية وضعيفة.",[["توصل","موصله","توصيل"],["تتفكك","ايونات"],["لا تتفكك","غير موصله","كحول","سكروز"],["قويه","ضعيفه"]],"الفرق الجوهري: التفكك إلى أيونات."],
[0,1,"عرّف الإلكتروليتات القوية.","الإلكتروليتات القوية: هي المواد التي تكون محاليلها المائية عالية التوصيل للتيار الكهربائي وذلك بسبب تفككها التام إلى أيونات سالبة وموجبة، وتشمل الحوامض القوية والقواعد القوية ومعظم الأملاح الذائبة في الماء.",[["محاليلها","المائيه"],["عاليه التوصيل","عاليه","موصله"],["تفكك تام","التام","تفككها"],["حوامض قويه","قواعد قويه","املاح"]],"قوية = تتفكك 100%: HCl, NaOH, NaCl."],
[0,9,"علّل: ينتج عن ذوبان الإلكتروليتات القوية في الماء محاليل عالية التوصيل للكهربائية.","وذلك بسبب تأينها أو تفككها بشكل تام إلى أيونات موجبة وسالبة.",[["تفكك","تاين","تأين"],["تام","كامل"],["ايونات"]],"تفكك تام ← أيونات كثيرة ← توصيل عالٍ. جملة وحدة وتنجح (ورد 9 مرات!)."],
[0,1,"هناك ثلاث فئات من المواد الإلكتروليتية القوية، عددها؟","1) الحوامض القوية. 2) القواعد القوية. 3) أملاح ذائبة بالماء (تامة الذوبان).",[["حوامض"],["قواعد"],["املاح","ذائبه"]],"حوامض + قواعد + أملاح ذائبة. ثلاث ركائز."],
[1,1,"عرّف الإلكتروليت الضعيف.","الإلكتروليت الضعيف: هي المواد التي تكون منصهراتها أو محاليلها ضعيفة (رديئة) التوصيل للتيار الكهربائي وذلك بسبب تأينها (تفككها) بشكل جزئي إلى أيونات موجبة وأخرى سالبة، ويعبر عنها بسهمين متعاكسين {⇌} مثل NH₃.",[["ضعيف","رديئ","رديئه"],["جزئي"],["ايونات"],["سهمين","⇌"]],"سهم واحد → قوية. سهمين ⇌ ضعيفة."],
[1,2,"علّل: ينتج عن ذوبان الإلكتروليتات الضعيفة في الماء محاليل ضعيفة التوصيل للكهربائية.","وذلك بسبب تأينها بشكل جزئي (محدود) أو غير تام في محاليلها المائية.",[["جزئي","محدود","غير تام"],["تاين","تفكك"]],"عكس القوية: تفكك جزئي ← أيونات قليلة ← توصيل ضعيف."],
[1,2,"ما الفرق بين الإلكتروليتات القوية والإلكتروليتات الضعيفة؟","<b>القوية:</b> محاليلها عالية التوصيل بسبب تفككها التام إلى أيونات، مثل الحوامض القوية HCl والقواعد القوية NaOH ومعظم الأملاح الذائبة. {HCl → H⁺ + Cl⁻}<br><b>الضعيفة:</b> محاليلها ضعيفة التوصيل لكونها تتأين بشكل جزئي محدود، مثل الحوامض والقواعد الضعيفة. {CH₃COOH ⇌ CH₃COO⁻ + H⁺}",[["قويه","تفكك تام","تام"],["ضعيفه","جزئي","محدود"],["HCl","NaOH","حوامض قويه"],["CH3COOH","حوامض ضعيفه","قواعد ضعيفه"]],""],
[1,1,"عرّف قاعدة برونشتد.","قاعدة برونشتد: هي المادة التي لها القابلية على اكتساب بروتون مكونة حامض قرين، وقد تكون جزيئة متعادلة أو أيوناً موجباً أو أيوناً سالباً.",[["اكتساب","تكتسب","تاخذ"],["بروتون"],["حامض قرين","قرين"]],"القاعدة تأخذ H⁺، مثل NH₃ تصير NH₄⁺."],
[1,1,"عرّف حامض برونشتد.","حامض برونشتد: هو مادة لها القابلية على فقدان بروتون وتكوين قاعدة قرينة.",[["فقدان","تفقد","يفقد","اعطاء","يعطي"],["بروتون"],["قاعده قرينه","قاعده","قرينه"]],"الحامض يفقد بروتون ويتحول إلى قاعدة قرينة."],
[2,4,"علام تعتمد قوة الحامض أو القاعدة حسب نظرية برونشتد – لوري؟ عدد ذلك.","1) تعتمد قوة الحامض على مدى قابلية الحامض على فقدان البروتون H⁺.<br>2) تعتمد قوة القاعدة على مدى قابلية القاعدة على اكتساب البروتون H⁺.<br>3) تعتمد على الوسط الذي يحتوي هذه الأصناف.<br><i>ملاحظة: أي تعبير يفي بالغرض يعطى درجة كاملة.</i>",[["فقدان","يفقد","تفقد"],["اكتساب","تكتسب","يكتسب"],["الوسط","المذيب"]],"قوة الحامض = سهولة فقدانه لـ H⁺، وللوسط (المذيب) دور."],
[2,5,"عرّف درجة التأين.","درجة التأين: هي النسبة بين كمية الصنف المذاب المتفككة عند حالة الاتزان إلى كمية الصنف المذاب الكلية. أو: هي النسبة بين تركيز الجزء المتأين من المادة عند حالة الاتزان إلى التركيز الابتدائي للمادة.",[["نسبه"],["المتفكك","المتأين","المتاين","الجزء"],["الكليه","الابتدائي","الكلي"],["اتزان","الاتزان"]],"درجة التأين = المتفكك ÷ الكلي. مثلاً 5 من 100 جزيء ← 0.05."],
[2,2,"علّل: تزداد درجة تأين الإلكتروليتات الضعيفة عند التخفيف.","لأن عملية التخفيف تؤدي إلى إزاحة موقع الاتزان من موقعه الأصلي إلى موقع جديد لإزالة التأثير الخارجي (عملية التخفيف) وذلك بأن يزداد تفكك المذاب (يتأين)، وهذه العملية تؤدي إلى نقصان في كمية الجزء غير المتفكك من المذاب (جزيئات الحامض) وتزيد من كمية الجزء المتفكك منه.",[["ازاحه","يزاح","تزاح","تزيح","ازاح"],["الاتزان","اتزان"],["التخفيف","تخفيف"],["تفكك","يتاين","تاين"]],"أكثر ماء ← تفكك أكثر (قاعدة لوشاتيليه)."],
[2,1,"أملأ الفراغات الآتية: قيم ثوابت تفكك الحوامض الضعيفة المختلفة تعد مقياساً لقوة هذه الحوامض النسبية، فكلما ...... قيمة ثابت تفكك الحامض ...... حموضته.","فكلما <b>زادت</b> قيمة ثابت تفكك الحامض (زاد مقدار تفككه) <b>ازدادت</b> حموضته، أو كلما <b>قلت</b> قيمة ثابت التفكك (قل مقدار تفككه) <b>قلت</b> حموضته.",[["زادت","ازدادت","تزداد","يزداد"],["قلت","تقل","ينقص","نقصت"]],"Kₐ كبير = حامض أقوى."],
[2,3,"عرّف حامض متعدد البروتون.","حامض متعدد البروتون: هو الحامض الذي يمكن لكل جزيء منه أن ينتج بروتوناً أو أكثر وعلى مراحل متعددة، وغالباً ما يكون البروتون الذي ينتج في الخطوة الأخيرة ضعيفاً، مثل H₂C₂O₄.",[["بروتون"],["اكثر","متعدد"],["مراحل","خطوات"]],"أكثر من H⁺ قابل للتأين، يتفكك خطوة بخطوة."],
[2,1,"عرّف حامض ضعيف متعدد البروتون.","حامض ضعيف متعدد البروتون: هو الحامض الذي يمتلك أكثر من ذرة هيدروجين واحدة قابلة للتأين (بروتون ضعيف) مثل حامض الأوكزاليك H₂C₂O₄.",[["اكثر من ذره","اكثر من"],["هيدروجين"],["قابله للتاين","تاين","يتاين"],["ضعيف"]],"الكلمة المهمة: أكثر من ذرة هيدروجين قابلة للتأين."],
[2,1,"علّل: تقل Kₐ باستمرار تأين الحامض الضعيف المتعدد البروتون.","بسبب نقصان قابلية الأصناف التي تحمل شحنة سالبة على فقدان بروتون موجب الشحنة بسبب ازدياد التجاذب الإلكتروستاتيكي بين أيونات ذوات الشحنة المختلفة.",[["نقصان","تقل","قل"],["سالبه","سالب"],["تجاذب","الكتروستاتيكي","جذب"],["بروتون","فقدان"]],"الأيون السالب يمسك H⁺ بقوة، فكل مرحلة Kₐ أقل."],
[3,2,"عرّف التأين الذاتي للماء. وما المقصود بعملية البرتنة؟","<b>التأين الذاتي للماء:</b> تفاعل كيميائي ينتقل فيه بروتون من جزيء ماء إلى جزيء ماء آخر ويكون ناتج هذه العملية في الماء النقي أعداداً متساوية من أيونات الهيدرونيوم {H₃O⁺} وأيونات الهيدروكسيد {OH⁻}.<br><b>البرتنة:</b> عملية انتقال البروتون من جزيئة ماء إلى جزيئة ماء أخرى بشكل تلقائي وهي المسؤولة عن الصفة الأمفوتيرية للماء.",[["انتقال بروتون","بروتون"],["جزيء ماء","جزيئه ماء","ماء اخر"],["هيدرونيوم","H3O"],["هيدروكسيد","OH"],["برتنه","انتقال","تلقائي"]],"الماء أمفوتيري: يتصرف كحامض وكقاعدة."],
[3,1,"اختر الإجابة الصحيحة: إن [H⁺] المائي في محلول يحتوي على [OH⁻] المائي بتركيز 0.01 M هو:","<b>10⁻¹² M</b><br>{[H⁺][OH⁻] = 10⁻¹⁴ ⇒ [H⁺] = 10⁻¹⁴ / 10⁻² = 10⁻¹² M}",null,"اقسم 10⁻¹⁴ على المعطى.",["10⁻¹⁶","10⁻¹⁰","10⁻¹²"],2],
[4,2,"عدد أنواع الأملاح مع مثال لكل نوع.","1) <b>الأملاح المتعادلة</b> (حامض قوي وقاعدة قوية) مثل NaCl.<br>2) <b>الأملاح الحامضية</b> (حامض قوي وقاعدة ضعيفة) مثل NH₄Cl.<br>3) <b>الأملاح القاعدية</b> (قاعدة قوية وحامض ضعيف) مثل CH₃COONa.",[["متعادله"],["حامضيه"],["قاعديه"],["NaCl","كلوريد الصوديوم"],["NH4Cl","كلوريد الامونيوم"],["CH3COONa","خلات الصوديوم"]],"القاعدة الذهبية: «القوي يغلب»."],
[4,1,"عند التعامل مع المحاليل المائية المخففة للأملاح يتطلب تصنيفها إلى عدة أصناف، عددها.","1) أملاح لقواعد قوية وحوامض قوية. 2) أملاح لقواعد قوية وحوامض ضعيفة. 3) أملاح لقواعد ضعيفة وحوامض قوية. 4) أملاح لقواعد ضعيفة وحوامض ضعيفة.",[["قواعد قويه وحوامض قويه","قويه وقويه"],["قواعد قويه وحوامض ضعيفه","قويه وضعيفه"],["قواعد ضعيفه وحوامض قويه","ضعيفه وقويه"],["قواعد ضعيفه وحوامض ضعيفه","ضعيفه وضعيفه"]],"أربع تركيبات: قوي/ضعيف."],
[4,6,"علّل: محاليل الأملاح المشتقة من الحوامض القوية والقواعد القوية تكون محاليل متعادلة. (أو: عند إذابة NaCl في الماء لا تتغير قيمة pH، والمحلول المائي لملح KNO₃ ذو صفات متعادلة.)","وذلك لأنه ليس لأيوناتها الموجبة أو السالبة (حيث تعتبر قرائن ضعيفة) القابلية على التفاعل بشكل ملحوظ مع جزيئات الماء، فتبقى {[H⁺] = [OH⁻]} ثابتة، ولا يضطرب الاتزان الموجود بين أيونات H⁺ و OH⁻ في الماء وبالتالي تبقى pH = pOH = 7.",[["ايونات"],["ضعيفه","قرائن"],["لا تتفاعل","ليس لها","لاتتفاعل"],["الماء","جزيئات الماء"],["الاتزان","ثابت","7"]],"الأيونات قرائن ضعيفة فما تغيّر H⁺ ولا OH⁻ ← pH = 7."],
[4,5,"أملأ الفراغات (الأملاح المتعادلة): 1) محلول NaCl متعادل لأنه ملح مشتق من ... 2) محلول K₂SO₄ ذو تأثير ... على الدلائل. 3) pH لمحلول KNO₃ بتركيز 0.1 M يساوي ... 4) pH لمحلول NaNO₃ بتركيز 0.05 M يساوي ...","1) حامض قوي وقاعدة قوية.<br>2) متعادل.<br>3) 7.<br>4) 7.<br><i>(التركيز والحجم ما يهمّون في الأملاح المتعادلة)</i>",[["حامض قوي","حامضقوي"],["قاعده قويه"],["متعادل"],["7"]],"أي ملح من حامض قوي + قاعدة قوية ← pH = 7 مهما كان التركيز."],
[4,1,"عرّف الأملاح القاعدية.","الأملاح القاعدية: هي الأملاح الناتجة من إذابة أملاح مشتقة من قواعد قوية وحوامض ضعيفة في الماء ويكون المحلول الناتج ذو صفة قاعدية.",[["املاح"],["قواعد قويه"],["حوامض ضعيفه"],["قاعديه","قاعدي"]],""],
[4,12,"علّل: محاليل الأملاح المشتقة من القواعد القوية والحوامض الضعيفة تعد محاليل قاعدية دائماً. (أو: المحلول المائي لخلات البوتاسيوم CH₃COOK ذو تأثير قاعدي على الدلائل.)","بسبب قابلية الأيون السالب للملح (العائد في الأصل إلى الحامض الضعيف) على التفاعل مع الماء لتكوين أيون OH⁻، أو بسبب قابلية الأيون السالب للملح على التفاعل مع أيون الهيدروجين الموجب H⁺ ونتيجة لذلك تنقص H⁺ في المحلول مما يجعل جزيئات H₂O تأتي لتعويض النقص مما يؤدي إلى تكون زيادة في كمية OH⁻ ويصبح المحلول قاعدياً.<br>{CH₃COONa → CH₃COO⁻ + Na⁺}<br>{CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻}",[["الايون السالب","ايون الحامض","الايون"],["يتفاعل مع الماء","تفاعل مع الماء","يسحب","تفاعل"],["OH","هيدروكسيد"],["زياده","تزداد","تركيز"],["قاعدي","قاعديا","قاعديه"]],"أيون الحامض الضعيف (قرين قوي) يسحب H⁺ من الماء ← يتبقى OH⁻ زيادة ← قاعدي. (ورد 12 مرة، أهم سؤال!)"],
[4,1,"عرّف الأملاح الحامضية.","الأملاح الحامضية: وهي الأملاح المشتقة من قواعد ضعيفة وحوامض قوية وتكون ذات صفات حامضية دائماً. مثل NH₄Cl المشتق من HCl و NH₃.",[["قواعد ضعيفه"],["حوامض قويه"],["حامضيه"],["NH4Cl","كلوريد الامونيوم"]],"عكس القاعدية: الأيون الموجب يعطي H⁺."],
[4,1,"علّل: تكون المحاليل المائية لأملاح القواعد الضعيفة والحوامض القوية ذات صفات حامضية. (وعند إذابة NH₄Cl في الماء يكون المحلول ذا صفة حامضية.)","لأن تفاعل التحلل المائي هو تفاعل الأيون الموجب للملح (العائد في الأصل للقاعدة الضعيفة) مع الماء لتكوين جزيئات القاعدة الضعيفة غير المتفككة إضافة إلى أيونات H⁺. يؤدي هذا التفاعل إلى اختلال في التوازن الموجود بين H⁺ و OH⁻ في الماء وبالنتيجة يؤدي إلى زيادة في [H⁺] وجعل هذا النوع من المحاليل حامضية.<br>{NH₄⁺ + H₂O ⇌ NH₃ + H₃O⁺}",[["الايون الموجب","ايون موجب"],["تفاعل","تحلل مائي"],["الماء"],["زياده","تزداد","هيدروجين"],["حامضي","حامضيه"]],""],
[5,1,"عرّف تأثير الأيون المشترك.","تأثير الأيون المشترك: وهي ظاهرة تقليل تفكك الإلكتروليت الضعيف الناتجة عن وجود إلكتروليت قوي يحوي أحد أيونات الإلكتروليت الضعيف في نفس المحلول.",[["تقليل","يقلل","تقل","قله","نقصان"],["تفكك","تاين"],["الكتروليت ضعيف","الضعيف"],["الكتروليت قوي","قوي","ايون مشترك","نفس المحلول"]],"مثل ضيف يدخل مكان مزدحم: الأيون الزائد يرجّع التفاعل للخلف."],
[5,1,"علّل: تزداد درجة تفكك HNO₂ بإضافة الماء إليه وتقل بإضافة KNO₂ إليه.","لأنه بإضافة الماء يقل [H⁺] لذلك لتعويض النقص الحاصل بتركيزها يزداد تفكك HNO₂، بينما عند إضافة KNO₂ يزداد [NO₂⁻] لذلك يتجه التفاعل خلفياً ليقلل من [NO₂⁻] ويقل [H⁺] فتقل درجة التفكك.",[["اضافه الماء","الماء","تخفيف"],["يقل","نقص"],["تعويض","يزداد التفكك","يزداد تفكك","يتفكك"],["ايون مشترك","NO2","KNO2","نيتريت"],["الخلفي","خلفي","عكسي","درجه التفكك"]],"ماء = تخفيف = تفكك أكثر. ملح فيه أيون مشترك = تفكك أقل."],
[5,1,"علّل: يقل تفكك HF عند إضافة كمية من محلول NaF إليه.","وذلك حسب قاعدة لوشاتيليه سوف يزداد تركيز أيون F⁻ ويتجه التفاعل باتجاه المتفاعلات (خلفي) أي بسبب وجود الأيون المشترك، فلتقليل الزيادة بتركيز F⁻ يتجه بالاتجاه الخلفي ويقل تفكك HF.",[["لوشاتيليه","لوشاتليه"],["ايون مشترك"],["يزداد تركيز","زياده"],["الخلفي","خلفي","المتفاعلات","عكسي"],["يقل تفكك","تفكك","يقل"]],"الأيون المشترك هنا F⁻."],
[5,1,"ما التأثير الذي يحدثه إضافة كمية من خلات الصوديوم CH₃COONa إلى محلول حامض الخليك CH₃COOH مع كتابة المعادلات؟","{CH₃COOH ⇌ CH₃COO⁻ + H⁺}<br>{CH₃COONa → CH₃COO⁻ + Na⁺}<br>عند إضافة كمية من خلات الصوديوم يؤدي إلى تقليل تأين الإلكتروليت الضعيف، وهذه الظاهرة هي نتيجة مباشرة لقانون فعل الكتلة على الاتزان الأيوني للمحلول الإلكتروليتي وتدعى بتأثير الأيون المشترك، وهي حالة خاصة من قاعدة لوشاتيليه.",[["تقليل","يقلل","يقل","نقصان"],["تاين","تفكك"],["الايون المشترك"],["لوشاتيليه","فعل الكتله"],["CH3COO","خلات"]],"اكتب المعادلتين ثم اقرن — الدرجة تحتاجهم."],
[5,1,"علّل: تقل درجة تفكك محلول HCN عند إضافة NaCN إليه.","{HCN ⇌ H⁺ + CN⁻}  {NaCN → Na⁺ + CN⁻} (أيون مشترك CN⁻)<br>بسبب وجود أيون مشترك الذي يرجح التفاعل العكسي فيقل تفكك الإلكتروليت الضعيف (الحامض) حسب قاعدة لوشاتيليه.",[["ايون مشترك","CN"],["الخلفي","العكسي","خلفي","عكسي"],["يقل","تقل"],["لوشاتيليه","لوشاتليه"]],"نفس فكرة HF و CH₃COOH: أضف ملح الحامض الضعيف ← يقل تفككه."],
[6,3,"عرّف محلول بفر.","محلول بفر: هو محلول مائي مكون من مزيج لحامض ضعيف مع أحد أملاحه (القاعدة القرينة للحامض الضعيف) أو قاعدة ضعيفة مع أحد أملاحها (الحامض القرين للقاعدة الضعيفة) ويكون لهذا المزيج القابلية على مقاومة التغير في قيمة الأس الهيدروجيني pH عند إضافة كمية صغيرة من حامض قوي أو قاعدة قوية إليه.",[["حامض ضعيف"],["ملح","احد املاحه"],["مقاومه التغير","مقاومه"],["pH","الاس الهيدروجيني","الرقم الهيدروجيني"]],"البفر مثل الإسفنج: يمتص الصدمة. مثاله CH₃COOH + CH₃COONa."],
[7,4,"ما تأثير درجة الحرارة على الذوبانية؟ (ما تأثير التسخين على الذوبانية من حيث الواقع العملي؟)","تزداد ذوبانية معظم المواد الشحيحة الذوبان بزيادة درجة الحرارة ولكن يختلف مقدار هذه الزيادة من مادة إلى أخرى.",[["تزداد","زياده","تزيد"],["الذوبانيه"],["الحراره","التسخين"],["تختلف","مقدار","شحيحه"]],"تسخين ← ذوبانية أكبر، لكن الزيادة تختلف من مادة لمادة."],
[7,1,"ما التمذوب؟ وما تأثير درجة الحرارة على الذوبانية؟","التمذوب: هو عملية تفاعل الصنف المذاب مع جزيئات المذيب. أما تأثير الحرارة: فتزداد ذوبانية معظم المواد شحيحة الذوبان بزيادة درجة الحرارة ولكن يختلف مقدار هذه الزيادة من مادة إلى أخرى.",[["تفاعل"],["المذاب"],["جزيئات المذيب","المذيب"],["تزداد","زياده"],["الحراره"]],"التمذوب = المذاب يلتف حوله جزيئات المذيب."],
[7,4,"ما تأثير الأس الهيدروجيني على الذوبانية؟","تعتمد ذوبانية الكثير من المواد على تركيز أيون H⁺ في المحلول ومن أهم تلك المواد هي التي يشكل أيون الهيدروجين أو أيون الهيدروكسيد أحد مكوناتها مثل Mg(OH)₂ حيث يتغير مقدار ذوبانية هذه المواد مع تغير قيمة pH للمحلول ومن خلال تأثير الأيون المشترك.<br>{Mg(OH)₂ ⇌ Mg²⁺ + 2OH⁻}<br>فإضافة حامض (زيادة تركيز H⁺) إلى المحلول المشبع يؤدي إلى اتحاد H⁺ مع OH⁻ لتكوين جزيئات الماء، وهذا يؤدي إلى اختلال الاتزان ولتعويض النقص في OH⁻ تتفكك مزيد من جزيئات المركب (أي زيادة ذوبانيته). أما عند إضافة قاعدة (أيونات OH⁻) فإن ذلك يؤدي إلى تقليل الذوبانية من خلال تأثير الأيون المشترك.",[["تركيز","H"],["الهيدروكسيد","OH","الهيدروجين"],["ايون مشترك","الايون المشترك"],["حامض","زياده الذوبانيه","تزداد"],["قاعده","تقليل","تقل"]],"إضافة حامض ← يستهلك OH⁻ ← يذوب Mg(OH)₂ أكثر. إضافة قاعدة ← الذوبانية تقل."],
[7,1,"علّل: تزداد ذوبانية Mg(OH)₂ عند إضافة حامض إلى محلوله المائي المشبع.","{Mg(OH)₂ ⇌ Mg²⁺ + 2OH⁻}<br>لأنه عند إضافة حامض (زيادة في تركيز H⁺) إلى المحلول المشبع لهذا المركب يؤدي إلى اتحاد أيونات H⁺ مع أيونات الهيدروكسيد OH⁻ لتكوين جزيئات الماء، وهذا يؤدي إلى اختلال في عملية الاتزان ولتعويض النقص الحاصل في أيونات OH⁻ تتفكك مزيد من جزيئات المركب Mg(OH)₂ (زيادة في الذوبانية).",[["اتحاد","يتحد","يتفاعل","يستهلك"],["هيدروكسيد","OH"],["ماء","جزيئات الماء"],["اختلال","الاتزان"],["تعويض","يتفكك","تتفكك","يذوب"]],"{H⁺ + OH⁻ → H₂O}: OH⁻ يختفي ← النظام يعوّض ← يذوب المزيد."],
[7,1,"عدد العوامل المؤثرة في الذوبانية.","1) تأثير درجة الحرارة. 2) تأثير الأيون المشترك. 3) تأثير الأس الهيدروجيني.",[["حراره","درجه الحراره"],["ايون مشترك","الايون المشترك"],["الاس الهيدروجيني","pH"]],"ثلاثة عوامل: حرارة، أيون مشترك، pH."],
[7,1,"ما أهمية الأيون المشترك على الذوبانية؟","من قاعدة لوشاتيليه نستنتج أن ذوبانية أي إلكتروليت ضعيف (ملح شحيح الذوبان) تنخفض عند وجود زيادة من أيونات مشتركة لهذه المادة في المحلول، ويمكن الاستفادة من هذه الظاهرة في التحكم بعملية ذوبان الرواسب (المواد الشحيحة الذوبان).",[["لوشاتيليه","لوشاتليه"],["تنخفض","تقل","تقليل"],["ايونات مشتركه","ايون مشترك"],["التحكم","الرواسب","ترسيب","ذوبان"]],"نتحكم بالراسب: أضف أيون مشترك ← الذوبانية تقل ويزداد الراسب."],

function mistakes(){const l=Object.keys(mis).map(i=>QM[i]).filter(Boolean);if(!l.length)return toast('ما عندك أخطاء 👏');session(l,'أخطائي',home)}
function studyView(list,title,back){let i=0;const go=()=>{const q=list[i];
show(`${fr()}<div class="top"><button class="bk" id="ab">✕</button><div class="pr"><div style="width:${Math.round((i+1)/list.length*100)}%"></div></div><span class="cnt">${i+1}/${list.length}</span></div><div class="card q"><span class="chip">${T[q.t]}</span> <span class="yr">🔥 ورد ${q.y==1?'مرة واحدة':q.y+' مرات'} في الوزاري</span><div class="qt">${fm(q.q)}</div></div><div class="sol"><b class="h">الجواب</b><br>${fm(q.a)}</div>${q.tip?`<div class="tip">🦆 ${fm(q.tip)}</div>`:''}<div class="row"><button class="btn g" id="pv" ${i?'':'disabled'}>▶ السابق</button><button class="btn" id="nx">${i<list.length-1?'التالي ◀':'إنهاء ✔'}</button></div>`);
$('#ab').onclick=back;$('#pv').onclick=()=>{i--;go()};$('#nx').onclick=()=>{if(i<list.length-1){i++;go()}else back()}};go()}
function session(list,title,back,ord,study){if(study)return studyView(list,title,back);let Q=ord?list.slice():shuf(list.slice()),tot=list.length,solved=new Set(),tries=0;
const pc=()=>Math.round(solved.size/tot*100);
const next=()=>Q.length?render(Q[0]):end();
function end(){show(`${fr()}<div class="card" style="text-align:center"><div style="font-size:54px">🏆</div><h2>خلصت: ${title}</h2><p>أجبت ${solved.size} من ${tot} بشكل صحيح، وعدد المحاولات ${tries}.<br>${Object.keys(mis).length?'الأسئلة اللي غلطت بيها محفوظة في «أخطائي».':'ما بقي عندك أي خطأ!'}</p><button class="btn" id="bk">رجوع</button></div>`);$('#bk').onclick=back}
function fin(q,r){tries++;Q.shift();if(r>=1){solved.add(q.id);done[q.id]=1;delete mis[q.id]}else{mis[q.id]=(mis[q.id]||0)+1;delete done[q.id];Q.splice(Math.min(2,Q.length),0,q)}save();next()}
function render(q){let pick=-1;
show(`${fr()}<div class="top"><button class="bk" id="ab">✕</button><div class="pr"><div style="width:${pc()}%"></div></div><span class="cnt">${solved.size}/${tot}</span></div>
<div class="card q"><span class="chip">${T[q.t]}</span> <span class="yr">🔥 ورد ${q.y==1?'مرة واحدة':q.y+' مرات'} في الوزاري</span><div class="qt" id="qt">${fm(q.q)}</div>${q.opts?`<div>${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="m">${o}</span></button>`).join('')}</div>`:`<textarea id="ta" placeholder="اكتب إجابتك بكلماتك"></textarea>`}</div><div id="fb"></div><button class="btn" id="ck">تحقق ✔</button>${q.opts?'':'<button class="btn g" id="dk">👀 ما أعرف — شوف الجواب</button>'}`);
$('#ab').onclick=back;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))});
const reveal=(r,m)=>{$('#ck').style.display='none';if($('#dk'))$('#dk').style.display='none';app.querySelectorAll('.opt,textarea').forEach(x=>x.disabled=true);
$('#fb').innerHTML=`<div class="fbk ${m[0]}">${m[1]}</div><div class="sol"><b class="h">الجواب النموذجي</b><br>${fm(q.a)}</div>${q.tip?`<div class="tip">🦆 ${fm(q.tip)}</div>`:''}<button class="btn" id="nx">التالي ◀</button>`;$('#nx').onclick=()=>fin(q,r)};
$('#ck').onclick=()=>{const txt=$('#ta')?$('#ta').value.trim():'';if(q.opts&&pick<0)return toast('اختر إجابة');if(!q.opts&&!txt)return toast('اكتب إجابتك أولاً');
const r=grade(q,txt,pick);reveal(r,r>=1?['ok','✅ صح، أحسنت']:r>0?['mid','⚠️ ناقصة — حاول تكمل الجواب']:['bad','❌ غلط — راح تنعاد عليك'])};
$('#qt').onclick=()=>{return;reveal(0,['mid','📖 هذا جوابك النموذجي — راح ينعاد عليك للمراجعة'])};
if($('#dk'))$('#dk').onclick=()=>reveal(0,['mid','📖 اقرأ الجواب زين — راح تنعاد عليك'])}
next()}
