<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbd5e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>لشهد 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Cairo",system-ui,sans-serif;color:#7a1f4f;background:linear-gradient(160deg,#fff1f7 0%,#fbd5e8 55%,#e9d5ff 100%);min-height:100vh;overflow-x:hidden}
#intro{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff0f7,#f9c6e0 50%,#e9b8f0);transition:opacity .7s;padding:20px}
.ibox{background:#fff;border-radius:220px 220px 36px 36px;padding:60px 26px 34px;width:min(88vw,420px);text-align:center;box-shadow:0 30px 70px rgba(214,51,108,.22)}
.ibox h1{font-family:"Lalezar",serif;font-weight:400;font-size:52px;line-height:1.5;color:#b1264f;margin:0}
.sub{font-family:"Lalezar",serif;font-size:24px;color:#c2407a;min-height:76px;margin-top:12px;line-height:1.7}
#igo{opacity:0;transition:opacity 1s;margin-top:16px;border:0;border-radius:999px;padding:12px 44px;font-family:"Lalezar",serif;font-size:26px;color:#fff;background:linear-gradient(120deg,#f9a8c7,#d6336c);cursor:pointer;box-shadow:0 10px 26px rgba(214,51,108,.3)}
.pt{position:fixed;top:-40px;z-index:9998;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#page{max-width:520px;margin:0 auto;padding:28px 16px 60px;display:none}
.card{background:rgba(255,255,255,.93);border-radius:32px;padding:34px 24px;box-shadow:0 24px 60px rgba(190,24,93,.16);text-align:center;margin-bottom:18px}
.tag{display:inline-block;background:#ffe4ef;color:#b1264f;border-radius:999px;padding:4px 16px;font-weight:800;font-size:15px;margin-bottom:12px}
.title{font-family:"Lalezar",serif;font-size:40px;line-height:1.5;color:#b1264f;margin:0 0 6px}
.poem{font-family:"Lalezar",serif;font-size:27px;line-height:2.1;color:#7a1f4f;margin:14px 0 0}
.poem div{opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s}
.poem div.on{opacity:1;transform:none}
.apology{font-size:19px;line-height:2;color:#7a1f4f;margin-top:8px}
.big{font-family:"Lalezar",serif;font-size:34px;line-height:1.6;background:linear-gradient(90deg,#db2777,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:8px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 30px;font-family:"Lalezar",serif;font-size:24px;color:#fff;background:linear-gradient(120deg,#f9a8c7,#d6336c);cursor:pointer;box-shadow:0 10px 26px rgba(214,51,108,.3)}
.heart{position:fixed;bottom:-40px;z-index:9997;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}

.hero{width:min(74vw,300px);aspect-ratio:3/4;margin:0 auto 18px;border-radius:200px 200px 28px 28px;overflow:hidden;border:3px solid #f9a8c7;box-shadow:0 0 0 8px rgba(249,168,199,.25),0 22px 50px rgba(190,24,93,.25);position:relative}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(190,24,93,.18))}
.hcap{font-family:"Lalezar",serif;font-size:22px;color:#b1264f;margin:0 0 10px}
</style>
</head>

    <h2 class="title">مصالحة 🌸</h2>
    <div class="apology">أعتذر لكِ من قلبي، وأنتِ أغلى من أن أخسركِ بسبب كلمة أو موقف.</div>
    <div class="poem" id="poem"></div>
  </div>
  <div class="card">
    <div class="big">أحبكِ، وأعدكِ بأن أكون أفضل</div>
    <br>
    <button class="btn" id="love">💖 اضغطي هنا</button>
  </div>
</div>

<script>
const LINES=[
 "يا فاتِنَ العينينِ جئتُكَ مرهقًا",
 "من وحي حُسنِكَ راعني أن أُقتلا",
 "تلكَ العيونُ الناعِساتُ فتكنَ بي",
 "باللّحظِ أم بالكُحلِ صرتُ مُجندَلا؟",
 "القتلُ في شرعِ الإلهِ مُحرَّمٌ",
 "وبشرعِ حُسنِكَ لا يزالُ مُحلَّلا"
];
const SUB=["هذه رسالة من القلب…","كلمات أعتذر بها، وأحبكِ بها…"];

(function(){
 const I=document.getElementById('intro'), T=document.getElementById('ityp'), G=document.getElementById('igo');
 let li=0,ci=0;
 function typ(){
  if(li>=SUB.length){G.style.opacity=1;return}
  T.textContent=SUB[li].slice(0,++ci);
  if(ci>=SUB[li].length){li++;ci=0;setTimeout(()=>{if(li<SUB.length)T.textContent='';typ()},900)}
  else setTimeout(typ,55);
 }
 setTimeout(typ,600);
 const fid=setInterval(()=>{
  if(!document.getElementById('intro')){clearInterval(fid);return}
  const p=document.createElement('span');
  p.className='pt';
  p.textContent=['🌸','🌷','💮','🌺'][Math.floor(Math.random()*4)];
  p.style.left=(Math.random()*100)+'vw';
  p.style.fontSize=(14+Math.random()*16)+'px';
  p.style.animationDuration=(5+Math.random()*4)+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9500);
 },600);

 G.onclick=()=>{
  I.style.opacity=0;setTimeout(()=>I.remove(),700);
  const E=['🌸','🌷','🌺','💮'];
  const cx=innerWidth/2, cy=innerHeight/2;
  for(let i=0;i<36;i++){
   const p=document.createElement('span');
   p.textContent=E[i%E.length];
   p.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;z-index:9996;pointer-events:none;font-size:'+(16+Math.random()*16)+'px';
   document.body.appendChild(p);
   const a=Math.random()*Math.PI*2, d=Math.max(innerWidth,innerHeight)*(0.35+Math.random()*0.55);
   p.animate([
    {transform:'translate(-50%,-50%) scale(0)',opacity:1},
    {transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px) translate(-50%,-50%)',opacity:.9,offset:.7},
    {transform:'translate('+(Math.cos(a)*d*1.05)+'px,'+(Math.sin(a)*d*1.05+160)+'px) translate(-50%,-50%) scale(.7)',opacity:0}
   ],{duration:2800+Math.random()*1000,delay:Math.random()*350,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
   setTimeout(()=>p.remove(),4500);
  }
  const page=document.getElementById('page');
  page.style.display='block';
  const box=document.getElementById('poem');
  LINES.forEach((ln,k)=>{
   const d=document.createElement('div');
   d.textContent=ln;
   box.appendChild(d);
   setTimeout(()=>d.classList.add('on'),900+k*900);
  });
 };

 document.getElementById('love').onclick=()=>{
  for(let i=0;i<24;i++){
   const h=document.createElement('span');
   h.className='heart';
   h.textContent=['💖','🌸','💗','🌷'][i%4];
   h.style.left=(Math.random()*100)+'vw';
   h.style.fontSize=(18+Math.random()*18)+'px';
   h.style.animationDuration=(3+Math.random()*3)+'s';
   document.body.appendChild(h);
   setTimeout(()=>h.remove(),6500);
  }
 };
})();
</script>
</body>
